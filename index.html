<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workspace Apps</title>

    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">

    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        :root {
            --primary: #4f46e5;
            --primary-light: #818cf8;
            --accent: #0ea5e9;
            --bg: #f8fafc;
            --glass: rgba(255, 255, 255, 0.7);
            --glass-strong: rgba(255, 255, 255, 0.9);
            --text-main: #0f172a;
            --text-mute: #64748b;
            --text-dim: #94a3b8;
            --border: rgba(15, 23, 42, 0.06);
            --shadow-sm: 0 4px 12px rgba(15, 23, 42, 0.05);
            --shadow-md: 0 12px 24px rgba(15, 23, 42, 0.08);
            --shadow-lg: 0 24px 48px rgba(15, 23, 42, 0.12);
            --card-radius: 24px;
            --max-w: 1240px;
        }

        * {
            box-sizing: border-box;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html,
        body {
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', sans-serif;
            background: radial-gradient(circle at top left, rgba(79, 70, 229, 0.08), transparent 35%),
                radial-gradient(circle at bottom right, rgba(14, 165, 233, 0.08), transparent 35%),
                var(--bg);
            color: var(--text-main);
            line-height: 1.5;
        }

        body.modal-open {
            overflow: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .page {
            min-height: 100vh;
            padding: 32px 20px;
        }

        .container {
            max-width: var(--max-w);
            margin: 0 auto;
        }

        /* [1단] Header & Hero - 더 세련된 Glassmorphism */
        .header-section {
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 32px;
            padding: 32px 40px;
            margin-bottom: 28px;
            box-shadow: var(--shadow-md);
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-badge {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #fff;
            font-size: 22px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        .brand-copy h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .nav-links {
            display: flex;
            gap: 12px;
        }

        .hero-content h2 {
            margin: 0;
            font-size: 34px;
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: -0.03em;
            background: linear-gradient(to right, #1e293b, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-content p {
            margin: 14px 0 0;
            color: var(--text-mute);
            font-size: 16px;
            max-width: 800px;
            line-height: 1.6;
        }

        /* [2단] App Grid */
        /* [2단] Apps Section - 컨테이너 자체의 완성도 */
        .apps-section {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 32px;
            padding: 32px 22px;
            /* 상단 패딩을 늘려 타이틀이 숨을 쉬게 함 */
            margin-bottom: 28px;
            box-shadow: var(--shadow-sm);
        }

        /* 섹션 헤더 - 타이틀을 박스에 고정시키는 역할 */
        .section-head {
            display: flex;
            flex-direction: column;
            border-bottom: 1px solid rgba(15, 23, 42, 0.06);
            /* 아주 연한 구분선 추가 */
            padding-bottom: 10px;
            /* 타이틀과 구분선 사이 간격 */
            margin-bottom: 10px;
            /* 구분선과 그리드 사이 간격 */
        }


        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        /* App Card - 프리미엄 느낌의 카드 디자인 */
        .app-card {
            background: #fff;
            padding: 28px;
            border-radius: var(--card-radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            gap: 18px;
            position: relative;
            overflow: hidden;
        }

        .app-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-lg);
            border-color: rgba(79, 70, 229, 0.2);
        }

        .card-header {
            display: flex;
            gap: 18px;
            align-items: center;
        }

        .app-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #fff;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            flex-shrink: 0;
            box-shadow: 0 6px 12px rgba(79, 70, 229, 0.15);
        }

        .app-info h4 {
            margin: 0;
            font-size: 19px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .app-info .short-desc {
            margin: 4px 0 0;
            color: var(--text-mute);
            font-size: 13px;
            font-weight: 500;
        }

        .card-body {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .card-summary {
            font-size: 14px;
            color: var(--text-main);
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 44px;
            /* 요약 높이 통일 */
        }

        .card-features {
            margin: 0;
            padding-left: 18px;
            font-size: 13px;
            color: var(--text-mute);
            line-height: 1.6;
        }

        .card-features li {
            margin-bottom: 6px;
        }

        .tag-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 12px;
            background: #f1f5f9;
            color: #475569;
            border-radius: 99px;
        }

        .app-actions {
            display: flex;
            gap: 10px;
            margin-top: 4px;
        }

        /* Buttons */
        .btn {
            border: none;
            border-radius: 12px;
            padding: 10px 16px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn.primary {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
        }

        .btn.primary:hover {
            background: #4338ca;
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.3);
        }

        .btn.ghost {
            background: #f1f5f9;
            color: var(--text-main);
        }

        .btn.ghost:hover {
            background: #e2e8f0;
        }

        .btn.slim {
            font-size: 13px;
            padding: 8px 14px;
        }

        /* [3단] Footer */
        .footer-section {
            margin-top: 36px;
            padding: 32px 40px;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: var(--shadow-sm);
        }

        .footer-text h4 {
            margin: 0;
            font-size: 20px;
            font-weight: 800;
        }

        .footer-text p {
            margin: 6px 0 0;
            color: var(--text-mute);
            font-size: 14px;
        }

        /* Modal - 더 정교한 레이아웃 */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-backdrop.open {
            display: flex;
        }

        .modal-card {
            background: #fff;
            width: 100%;
            max-width: 580px;
            border-radius: 36px;
            padding: 48px;
            position: relative;
            max-height: 88vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
        }

        .close-btn {
            position: absolute;
            top: 24px;
            right: 24px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: #f1f5f9;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .close-btn:hover {
            background: #e2e8f0;
        }

        .modal-header {
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 32px;
        }

        .modal-icon {
            width: 64px;
            height: 64px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: #fff;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            box-shadow: 0 8px 16px rgba(79, 70, 229, 0.2);
        }

        .modal-header h3 {
            margin: 0;
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -0.03em;
        }

        .desc-body h5 {
            margin: 32px 0 12px;
            font-size: 13px;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 800;
        }

        .desc-body p {
            margin: 0;
            line-height: 1.8;
            font-size: 16px;
            color: var(--text-main);
        }

        .desc-body ul {
            margin: 0;
            padding-left: 20px;
            line-height: 1.8;
            font-size: 15px;
        }

        .desc-links {
            margin-top: 40px;
            padding-top: 32px;
            border-top: 1px solid #f1f5f9;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .section-head {
            margin-bottom: 20px;
        }

        .section-title-wrap {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .section-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .section-head h2 {
            margin: 0;
            font-size: 20px;
            font-weight: 800;
        }

        .section-head p {
            margin: 4px 0 0;
            font-size: 13px;
            color: var(--text-mute);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-section {
                padding: 32px 24px;
            }

            .top-nav {
                flex-direction: column;
                gap: 20px;
                align-items: flex-start;
            }

            .footer-section {
                flex-direction: column;
                gap: 24px;
                text-align: center;
            }

            .hero-content h2 {
                font-size: 28px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .modal-card {
                padding: 32px 24px;
            }
        }
    </style>
</head>

<body>

    <div class="page">
        <div class="container">

            <!-- [1단] Header & Hero -->
            <header class="header-section">
                <nav class="top-nav">
                    <div class="brand">
                        <div class="brand-badge"><i class="ri-apps-2-fill"></i></div>
                        <div class="brand-copy">
                            <h1>Workspace Apps</h1>
                        </div>
                    </div>
                    <div class="nav-links">
                        <a class="btn ghost slim" href="https://github.com/" target="_blank"><i
                                class="ri-github-fill"></i> GitHub</a>
                        <a class="btn ghost slim" href="#"><i class="ri-article-line"></i> Blog</a>
                    </div>
                </nav>
                <div class="hero-content">
                    <h2>작은 도구들을 각각의 방식으로</h2>
                    <p>생각, 문서, 일정, 텍스트를 각기 다른 앱으로 다룹니다. 필요한 앱 하나로 시작하거나, 여러 앱을 조합해 보세요.</p>
                </div>
            </header>

            <!-- [2단] Main Content -->
            <main class="apps-section">
                <div class="section-head">
                    <div class="section-title-wrap">

                        <div>
                            <h2>Apps</h2>
                        </div>
                    </div>
                </div>
                <div id="product-grid" class="grid"></div>
            </main>

            <!-- [3단] Footer -->
            <footer class="footer-section">
                <div class="footer-text">
                    <h4>More apps coming</h4>
                    <p>새로운 실험적인 앱들이 계속 추가될 예정입니다.</p>
                </div>
                <div class="nav-links">
                    <a class="btn primary slim" href="https://github.com/" target="_blank">GitHub 방문</a>
                </div>
            </footer>

        </div>
    </div>

    <!-- Modal -->
    <div id="detail-modal" class="modal-backdrop">
        <div class="modal-card">
            <button class="close-btn" onclick="closeDetail()"><i class="ri-close-line"></i></button>
            <div id="modal-content"></div>
        </div>
    </div>

    <script>
        const PRODUCTS = [
            {
                id: "workspace-hub",
                name: "Workspace Hub",
                icon: "ri-compass-3-line",
                short: "모든 앱의 통합 출발점",
                summary: "Canvas, Kanvan, Wiki 등 여러 앱을 한 곳에서 열고 전환할 수 있는 허브형 앱입니다. 작업의 흐름을 끊지 않고 도구를 전환하세요.",
                tags: ["허브", "통합"],
                useCases: ["여러 앱을 한 곳에서 관리하고 싶을 때", "도구 간 빠른 전환이 필요할 때"],
                links: { open: "https://canvas.supreme6922.workers.dev/", github: "https://github.com/", blog: "" }
            },
            {
                id: "canvas",
                name: "Canvas Workspace",
                icon: "ri-layout-grid-fill",
                short: "시각적 브레인스토밍 보드",
                summary: "아이디어를 공간 위에 자유롭게 배치하고 연결하는 보드형 앱입니다. 관계도 작성이나 시각적 사고 정리에 탁월합니다.",
                tags: ["시각화", "브레인스토밍"],
                useCases: ["아이디어를 자유롭게 배치하고 싶을 때", "관계도를 그리고 싶을 때"],
                links: { open: "#", blog: "https://your-blog-link.com" }
            },
            {
                id: "kanvan",
                name: "Kanvan Calendar",
                icon: "ri-calendar-todo-line",
                short: "일정과 업무의 결합",
                summary: "칸반 보드와 캘린더를 결합하여 업무 상태와 마감 기한을 한 화면에서 직관적으로 관리합니다.",
                tags: ["일정", "프로젝트"],
                useCases: ["업무 흐름을 보고 싶을 때", "마감일을 관리할 때"],
                links: { open: "#" }
            },
            {
                id: "wiki",
                name: "Wiki Builder",
                icon: "ri-book-open-line",
                short: "구조적인 지식 관리",
                summary: "문서를 계층 구조로 쌓아가는 위키형 에디터입니다. 개인 지식 베이스를 구축하기에 최적화되어 있습니다.",
                tags: ["문서", "지식관리"],
                useCases: ["장기적인 문서 관리가 필요할 때", "지식 베이스를 구축할 때"],
                links: { open: "#", blog: "https://your-blog-link.com" }
            }
        ];

        const LINK_META = {
            open: { label: '바로 열기', icon: 'ri-play-circle-line', className: 'primary' },
            github: { label: 'GitHub', icon: 'ri-github-fill', className: 'ghost' },
            blog: { label: '기술 블로그', icon: 'ri-article-line', className: 'ghost' },
            docs: { label: '문서', icon: 'ri-file-text-line', className: 'ghost' }
        };

        const gridEl = document.getElementById('product-grid');
        const modalEl = document.getElementById('detail-modal');
        const modalContentEl = document.getElementById('modal-content');

        function escapeHtml(v = '') {
            return String(v).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
        }

        function renderCards() {
            gridEl.innerHTML = PRODUCTS.map(p => `
        <article class="app-card">
          <div class="card-header">
            <div class="app-icon"><i class="${escapeHtml(p.icon)}"></i></div>
            <div class="app-info">
              <h4>${escapeHtml(p.name)}</h4>
              <p class="short-desc">${escapeHtml(p.short)}</p>
            </div>
          </div>
          <div class="card-body">
            <p class="card-summary">${escapeHtml(p.summary)}</p>
            <ul class="card-features">
              ${(p.useCases || []).slice(0, 2).map(u => `<li>${escapeHtml(u)}</li>`).join('')}
            </ul>
          </div>
          <div class="tag-row">
            ${(p.tags || []).map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join('')}
          </div>
          <div class="app-actions">
            ${p.links?.open ? `
              <a class="btn primary slim" href="${escapeHtml(p.links.open)}" target="_blank">
                <i class="ri-play-circle-line"></i> 열기
              </a>
            ` : ''}
            <button class="btn ghost slim" onclick="openDetail('${escapeHtml(p.id)}')">
              <i class="ri-information-line"></i> 설명 보기
            </button>
          </div>
        </article>
      `).join('');
        }

        function openDetail(id) {
            const p = PRODUCTS.find(item => item.id === id);
            if (!p) return;

            const resolvedLinks = [];
            if (p.links) {
                Object.entries(p.links).forEach(([type, href]) => {
                    if (href && LINK_META[type]) {
                        resolvedLinks.push({ ...LINK_META[type], href });
                    }
                });
            }

            modalContentEl.innerHTML = `
        <div class="modal-header">
          <div class="modal-icon"><i class="${escapeHtml(p.icon)}"></i></div>
          <h3>${escapeHtml(p.name)}</h3>
        </div>
        <div class="desc-body">
          <h5>Description</h5>
          <p>${escapeHtml(p.summary)}</p>
          <h5>Use Cases</h5>
          <ul>
            ${(p.useCases || []).map(u => `<li>${escapeHtml(u)}</li>`).join('')}
          </ul>
        </div>
        ${resolvedLinks.length ? `
          <div class="desc-links">
            ${resolvedLinks.map(l => `
              <a class="btn ${l.className} slim" href="${l.href}" target="_blank">
                <i class="${l.icon}"></i> ${l.label}
              </a>
            `).join('')}
          </div>
        ` : ''}
      `;
            modalEl.classList.add('open');
            document.body.classList.add('modal-open');
        }

        function closeDetail() {
            modalEl.classList.remove('open');
            document.body.classList.remove('modal-open');
        }

        modalEl.addEventListener('click', (e) => { if (e.target === modalEl) closeDetail(); });
        window.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDetail(); });

        renderCards();
    </script>
</body>

</html>
