<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workspace Apps</title>

<!-- Remix Icon -->
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">

<style>
body {
  margin:0;
  font-family: sans-serif;
  background:#f8fafc;
}

.topbar {
  display:flex;
  justify-content:space-between;
  padding:16px;
  background:#fff;
  border-bottom:1px solid #eee;
}

.section {
  padding:20px;
}

.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:16px;
}

.card {
  background:#fff;
  padding:16px;
  border-radius:12px;
  border:1px solid #eee;
}

.tag {
  font-size:12px;
  background:#eef;
  padding:4px 8px;
  border-radius:999px;
}

.link-chip {
  font-size:11px;
  color:#666;
}

button {
  padding:8px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.primary { background:#4f46e5; color:#fff; }
.ghost { background:#eee; }

.modal {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.5);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal.open { display:flex; }

.modal-box {
  background:#fff;
  padding:20px;
  border-radius:12px;
  width:90%;
  max-width:500px;
}
</style>
</head>

<body>

<div class="topbar">
  <div><strong>Workspace Apps</strong></div>
  <div>
    <a href="#">GitHub</a>
  </div>
</div>

<!-- ✅ 앱 먼저 -->
<section class="section">
  <h2>Apps</h2>
  <div id="grid" class="grid"></div>
</section>

<!-- ✅ hero는 아래 -->
<section class="section">
  <h3>작은 도구들을 각각의 방식으로</h3>
  <p>필요한 앱 하나로 시작하거나 여러 앱을 조합할 수 있습니다.</p>
</section>

<div id="modal" class="modal">
  <div class="modal-box" id="modalContent"></div>
</div>

<script>
const PRODUCTS = [
  {
    id:"workspace",
    name:"Workspace Hub",
    icon:"ri-compass-3-line",
    short:"여러 앱을 한 곳에서 여는 허브",
    cardLinks:[
      {type:"open",label:"workspace 열기",href:"https://canvas.supreme6922.workers.dev/"}
    ],
    links:{
      open:"https://canvas.supreme6922.workers.dev/"
    }
  },
  {
    id:"canvas",
    name:"Canvas",
    icon:"ri-layout-grid-fill",
    short:"아이디어 보드",
    cardLinks:[
      {type:"blog",label:"기술 글",href:""}
    ],
    links:{
      open:"/canvas.html"
    }
  }
];

const META = {
  open:{label:"열기"},
  blog:{label:"기술 글"},
  github:{label:"GitHub"},
  docs:{label:"문서"}
};

const grid = document.getElementById("grid");
const modal = document.getElementById("modal");
const modalContent = document.getElementById("modalContent");

function render() {
  grid.innerHTML = PRODUCTS.map(p => `
    <div class="card">
      <div><i class="${p.icon}"></i></div>
      <h4>${p.name}</h4>
      <p>${p.short}</p>

      ${(p.cardLinks||[]).map(l=>`
        <div class="link-chip">${l.label}</div>
      `).join("")}

      <button class="primary" onclick="openLink('${p.links.open}')">열기</button>
      <button class="ghost" onclick="detail('${p.id}')">상세</button>
    </div>
  `).join("");
}

function openLink(url){
  if(url) window.open(url);
}

function detail(id){
  const p = PRODUCTS.find(x=>x.id===id);

  const links = Object.entries(p.links||{})
    .filter(([k,v])=>v)
    .map(([k,v])=>`
      <button onclick="openLink('${v}')">${META[k].label}</button>
    `).join("");

  modalContent.innerHTML = `
    <h3>${p.name}</h3>
    <p>${p.short}</p>
    ${links}
  `;

  modal.classList.add("open");
}

modal.onclick = ()=> modal.classList.remove("open");

render();
</script>

</body>
</html>
